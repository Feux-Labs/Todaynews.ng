name: Scheduled Auto-Scraper + Auto-Publish

# Runs 7x/day at fixed times (converted from WAT/UTC+1 to UTC, since GitHub
# Actions cron always runs in UTC): 7am, 9am, 12pm, 2pm, 4pm, 9pm, 12am WAT.
# GitHub Actions cron has no Vercel Hobby-plan restriction — free at any cadence.
on:
  schedule:
    - cron: '0 6 * * *'   # 07:00 WAT
    - cron: '0 8 * * *'   # 09:00 WAT
    - cron: '0 11 * * *'  # 12:00 WAT
    - cron: '0 13 * * *'  # 14:00 WAT
    - cron: '0 15 * * *'  # 16:00 WAT
    - cron: '0 20 * * *'  # 21:00 WAT
    - cron: '0 23 * * *'  # 00:00 WAT
  workflow_dispatch:

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Todaynews.ng Scraper
        run: |
          echo "⏱️ $(date -u) — Triggering /api/cron/scrape..."
          RESPONSE=$(curl -sL -o /tmp/scrape_body.txt -w "%{http_code}" \
            --max-time 170 \
            -X GET "https://www.todaynews.ng/api/cron/scrape" \
            -H "Accept: application/json")
          echo "🔁 HTTP Status: $RESPONSE"
          cat /tmp/scrape_body.txt
          if [ "$RESPONSE" -ge 400 ]; then
            echo "⚠️ Scraper returned error $RESPONSE — will still proceed to auto-publish."
          else
            echo "✅ Scraper completed successfully."
          fi

      - name: Trigger Auto-Publish Check
        run: |
          echo "⏱️ $(date -u) — Triggering /api/cron/auto-publish..."
          RESPONSE=$(curl -sL -o /tmp/pub_body.txt -w "%{http_code}" \
            --max-time 30 \
            -X GET "https://www.todaynews.ng/api/cron/auto-publish" \
            -H "Accept: application/json")
          echo "🔁 HTTP Status: $RESPONSE"
          cat /tmp/pub_body.txt
          if [ "$RESPONSE" -ge 400 ]; then
            echo "⚠️ Auto-publish returned error $RESPONSE."
          else
            echo "✅ Auto-publish check completed."
          fi
